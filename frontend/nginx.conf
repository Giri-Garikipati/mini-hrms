# nginx serves the built React files, and forwards /api/... to the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Any other URL returns index.html, and React decides what to show
    location / {
        try_files $uri /index.html;
    }
}
